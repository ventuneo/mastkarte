<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {

	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {

}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {

.leaflet-safari .leaflet-tile-container {

.leaflet-container.leaflet-touch-zoom {

	}

	touch-action: none;

}

.leaflet-control {

.leaflet-top,

.leaflet-fade-anim .leaflet-popup {

	}

.leaflet-oldie .leaflet-control-zoom,

.leaflet-tooltip {

}

}
.leaflet-tooltip-bottom:before,

<style>
/* Gestaltung «Arbeitsplan im Feld»
   Die Karte ist das Planblatt. Darum herum nur Werkzeug: oben das Schriftfeld mit dem Massstab als
   Fortschritt, unten die Bedienleiste im Daumenbereich. Leuchtstift-Gelb heisst überall «kontrolliert»
   und ist nie Schmuck. Farben nur mit Bedeutung: Linien blau/grün, Zustand rot/orange, Meldungen violett.
   Bedienung in Atkinson Hyperlegible Next (lesbar bei Sonne und auf einen Blick, 1/l/I und 0/O klar
   getrennt), Planbeschriftung auf der Karte in Barlow Semi Condensed. */
:root {
  --bg: #e7ebe9;          /* Planpapier */
  --panel: #ffffff;       /* Flächen der Bedienung */
  --ink: #18222c;         /* Tusche: Schrift, Rahmen von Schriftfeld und Leisten */
  --muted: #56636e;
  --line: #c9d1d5;
  --chip: #eef1f2;        /* Eingabefelder, Knöpfe zweiter Stufe */
  --focus: #0b5cad;
  --strasse: #ffffff; --strasse-kontur: #c4cdd3; --strasse-tunnel: #b9c3ca;
  --kreis: #7d8b96; --kreis-text: #98a5ae;
  --tram: #1d4f91; --trolley: #138a6c;
  --markierung: #ffd200;
  --mast: #18222c; --bad: #d0312d; --nm: #d97f00; --neu: #7b3fe4; --gps: #1a73e8;
  --label: #34424d; --halo: #e7ebe9;
  --schatten: 0 6px 22px rgba(16, 24, 32, .2);
  --f-ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-plan: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --panel: #1a2229; --ink: #e6ecef; --muted: #9eadb7; --line: #2e3a44; --chip: #232d35; --focus: #79b6ff;
    --strasse: #2a343d; --strasse-kontur: #11171c; --strasse-tunnel: #222b33; --kreis: #6b7a86; --kreis-text: #56636d;
    --tram: #6ea8ff; --trolley: #3ccaa2; --mast: #e6ecef; --bad: #ff6a5c; --nm: #f0a030; --neu: #b28cff; --gps: #6ea8ff;
    --label: #c3cdd4; --halo: #11171c; --schatten: 0 6px 22px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --panel: #1a2229; --ink: #e6ecef; --muted: #9eadb7; --line: #2e3a44; --chip: #232d35; --focus: #79b6ff;
  --strasse: #2a343d; --strasse-kontur: #11171c; --strasse-tunnel: #222b33; --kreis: #6b7a86; --kreis-text: #56636d;
  --tram: #6ea8ff; --trolley: #3ccaa2; --mast: #e6ecef; --bad: #ff6a5c; --nm: #f0a030; --neu: #b28cff; --gps: #6ea8ff;
  --label: #c3cdd4; --halo: #11171c; --schatten: 0 6px 22px rgba(0, 0, 0, .5); color-scheme: dark;
}

/* ---------- Grundgerüst: Schriftfeld, Ansichtsleiste, Karte, Bedienleiste */
html, body { height: 100%; margin: 0; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
html, body { overscroll-behavior: none; }
body { background: var(--bg); color: var(--ink); font: 400 1rem/1.4 var(--f-ui); display: flex; flex-direction: column; min-height: 0; }
button { font: inherit; color: inherit; }
button, .chip { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.rand { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Schriftfeld */
.kopf {
  background: var(--panel); border-bottom: 2px solid var(--ink);
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "titel" "zahlen" "massstab";

<script>
(function () {
  'use strict';
  const D = window.KARTENDATEN;
  const root = document.documentElement;
  const css = n => getComputedStyle(root).getPropertyValue(n).trim();
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dec = arr => { const out = []; let x = 0, y = 0; for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; out.push([y / 1e5, x / 1e5]); } return out; };
  const ll = c => [c[1], c[0]];
  // Knöpfe zu Google Maps (Standort mit Route) und Street View für einen Punkt
  const gLinks = (lat, lon) => `<div class="g-links"><a href="https://www.google.com/maps/search/?api=1&amp;query=${lat},${lon}" target="_blank" rel="noopener">In Google Maps</a>` +
    `<a href="https://www.google.com/maps/@?api=1&amp;map_action=pano&amp;viewpoint=${lat},${lon}" target="_blank" rel="noopener">Street View</a></div>`;
  const TRAM_COL = () => css('--tram'), TROLL_COL = () => css('--trolley');

  // ---------- Kennzahlen
  const auff = D.masten.filter(m => m.zustand === 'auffällig').length;
  const nmess = D.masten.filter(m => String(m.zustand).startsWith('nicht messbar')).length;
  const pct = D.km_netz ? D.km_kontrolliert / D.km_netz * 100 : 0;
  const fmt1 = v => v.toLocaleString('de-CH', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  document.getElementById('z-masten').textContent = D.masten.length;
  document.getElementById('z-auff').textContent = auff;
  document.getElementById('z-km').textContent = `${fmt1(D.km_kontrolliert)} km kontrolliert`;
  document.getElementById('z-netz').textContent = `${fmt1(pct)} % von ${Math.round(D.km_netz)} km Netz`;
  document.getElementById('z-balken').style.width = Math.max(pct, 1.5) + '%';
  document.getElementById('stand').innerHTML = `<span class="zusatz">Fahrleitung Tram und Trolleybus, </span>Stand ${esc(D.stand)}`;
  // Massstab: Lineal über die Netzlänge, Strich alle 10 km (lang alle 50 km); der Leuchtstift reicht bis zur kontrollierten Länge
  const lineal = document.getElementById('lineal');
  lineal.setAttribute('aria-label', `${fmt1(D.km_kontrolliert)} von ${Math.round(D.km_netz)} km kontrolliert`);
  [...Array(Math.floor(D.km_netz / 10) + 1).keys()].map(i => i * 10).concat([D.km_netz]).forEach(km => {
    const st = document.createElement('i'); st.className = 'strich' + (km % 50 === 0 || km === D.km_netz ? ' gross' : '');
    st.style.left = (km / D.km_netz * 100) + '%'; lineal.appendChild(st);
  });

  // ---------- Karte und Ebenen
  const karte = window.__karte = L.map('karte', {
    zoomControl: true, minZoom: 11, maxZoom: 19, zoomSnap: 0.5,
    maxBounds: [[47.30, 8.40], [47.46, 8.65]], maxBoundsViscosity: 0.8
  }).setView([47.3765, 8.5000], 14);
  karte.attributionControl.setPrefix(false);
  karte.attributionControl.addAttribution(
    '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · ' +
    'Fahrplan ZVV (<a href="https://data.stadt-zuerich.ch/dataset/vbz_fahrplandaten_gtfs" target="_blank" rel="noopener">Open Data Stadt Zürich</a>, ' +
    'Haltestellen <a href="https://github.com/Miqell24/zurich-bus-map" target="_blank" rel="noopener">zurich-bus-map</a>) · ' +
    'Stadt Zürich · swisstopo');

  const panes = [['kreise', 205], ['strassen', 215], ['markierung', 300], ['oev', 350], ['beschriftung', 440], ['masten', 450]];
  panes.forEach(([n, z]) => { karte.createPane(n).style.zIndex = z; });
  karte.getPane('beschriftung').style.pointerEvents = 'none';
  const rnd = n => L.canvas({ pane: n, padding: 0.4, tolerance: n === 'masten' ? 8 : n === 'markierung' ? 6 : 0 });
  const R = { kreise: rnd('kreise'), strassen: rnd('strassen'), markierung: rnd('markierung'), oev: rnd('oev'), masten: rnd('masten') };

  // Kreise (nur Grenzen; der See liegt innerhalb der Kreise 2 und 8)
  const kreisLinien = D.kreise.map(k => L.polygon(k.r.map(dec), { renderer: R.kreise, pane: 'kreise', interactive: false, fill: false, weight: 1.4, dashArray: '6 5' }));
  const kreisGruppe = L.layerGroup(kreisLinien).addTo(karte);

  // Strassen: je Klasse eine Kontur- und eine Füllebene
  const KL = ['1', '2', '3', '4'];
  const strassen = {};
  KL.forEach(k => {
    const lines = (D.strassen[k] || []).map(dec);
    strassen[k] = {
      kontur: L.polyline(lines, { renderer: R.strassen, pane: 'strassen', interactive: false, lineCap: 'round', lineJoin: 'round' }),
      fuell: L.polyline(lines, { renderer: R.strassen, pane: 'strassen', interactive: false, lineCap: 'round', lineJoin: 'round' })
    };
  });
  const tunnel = L.polyline((D.strassen['9'] || []).map(dec), { renderer: R.strassen, pane: 'strassen', interactive: false, dashArray: '4 4' });
  // Zeichenreihenfolge: alle Konturen unten, dann Füllungen von klein nach gross
  tunnel.addTo(karte);
  ['4', '3', '2', '1'].forEach(k => strassen[k].kontur.addTo(karte));
  ['4', '3', '2', '1'].forEach(k => strassen[k].fuell.addTo(karte));

  // ÖV-Linien
  const oevLinien = D.oev.map(o => {
    const p = L.polyline(dec(o.c), { renderer: R.oev, pane: 'oev', interactive: false, lineJoin: 'round' });
    p._m = o.m; p._l = o.l; return p.addTo(karte);
  });

  // Kontrolliert (Leuchtstift)
  const markierung = D.kontrolliert.map(k => {
    const p = L.polyline(k.c.map(ll), { renderer: R.markierung, pane: 'markierung', interactive: !!k.m, lineCap: 'round', lineJoin: 'round' });
    p._l = k.l; p._ls = k.ls || [k.l];
    if (k.m) {
      const info = (D.manuell || [])[k.m - 1] || {};
      p.bindPopup(`<div class="pop"><h3>${esc(info.t || k.l)}</h3><div class="sub">als kontrolliert gemeldet am ${esc(info.d || '')}</div>
        <dl><dt>Länge</dt><dd>ca. ${fmt1(info.km || 0)} km</dd><dt>Masten</dt><dd>nicht einzeln erfasst</dd></dl></div>`, { maxWidth: 290 });
    }
    return p.addTo(karte);
  });

  // Masten
  const mastPunkte = D.masten.map(m => {
    const bad = m.zustand === 'auffällig';
    const nm = String(m.zustand).startsWith('nicht messbar');
    const p = L.circleMarker([m.lat, m.lon], { renderer: R.masten, pane: 'masten', weight: 2 });
    p._bad = bad; p._nm = nm; p._l = m.ls && m.ls.length ? m.ls : [m.linie];
    const adr = [m.strasse, m.hnr].filter(Boolean).join(' ');
    const zeilen = [
      ['Linie', esc([m.linie, m.richtung].filter(Boolean).join(', ') || '–')],
      (m.ls || []).length > 1 ? ['Linien hier', esc(m.ls.join(', '))] : null,
      m.nr ? ['Mast-Nr.', esc(m.nr)] : null,
      ['Kontrolle', esc(m.datum)],
      ['Zustand', `<span class="pill ${bad ? 'bad' : nm ? 'nm' : 'ok'}">${esc(m.zustand)}</span>`],
      m.befund ? ['Befund', esc(m.befund)] : null,
      m.diff != null ? ['Differenz', `${fmt1(m.diff)} mm`] : null,
      m.bem ? ['Bemerkung', esc(m.bem)] : null,
      ['Stadtkreis', esc(m.kreis ?? '–')]
    ].filter(Boolean);
    const wer = m.eig === 'VBZ' ? 'Mast der VBZ' : 'Mast des EWZ (öffentliche Beleuchtung)';
    p.bindPopup(`<div class="pop"><div class="pop-kopf"><span class="schild${bad ? ' bad' : ''}" title="Lauf-Nr. ${esc(m.lauf)}">${esc(m.lauf)}</span><div><h3>${esc(adr)}</h3><div class="sub">${wer}</div></div></div>

    let a = +m[1].replace(',', '.'), b = +m[2].replace(',', '.'); if (a < b) [a, b] = [b, a];
    return (a > 47 && a < 48 && b > 8 && b < 9) ? { lat: a, lon: b } : null; };
  // Fadenkreuz in der Mitte des sichtbaren Kartenteils über dem Blatt
  function kreuzPt() {
    const ms = karte.getSize(), kr = $('karte').getBoundingClientRect(), bl = $('blatt-platz').getBoundingClientRect();
    const unten = $('blatt-platz').classList.contains('offen') ? Math.min(ms.y, bl.top - kr.top) : ms.y;
    return L.point(ms.x / 2, Math.max(40, unten / 2));
  }
  function setzeKreuz() { const p = kreuzPt(); const k = document.querySelector('.fadenkreuz'); k.style.top = p.y + 'px'; k.style.left = p.x + 'px'; }
  const kreuzLL = () => karte.containerPointToLatLng(kreuzPt());
  function zielAufKreuz(lat, lon, z) {
    karte.setView([lat, lon], z || Math.max(karte.getZoom(), 18), { animate: false });
    const d = karte.latLngToContainerPoint([lat, lon]).subtract(kreuzPt()); karte.panBy(d, { animate: false });
  }
  function zeigePlatz() { const c = kreuzLL(); $('p-anzeige').textContent = `Kreuz: ${f7(c.lat)}, ${f7(c.lng)}`; }
  function platzStart() {
    document.body.classList.add('platzieren'); $('blatt-platz').classList.add('offen'); $('p-koord').value = ''; setzeKreuz();
    if (gpsPos) zielAufKreuz(gpsPos.lat, gpsPos.lon);
    else { if (karte.getZoom() < 17) karte.setZoom(17, { animate: false }); starteGps(true); }
    karte.on('move', zeigePlatz); zeigePlatz();
  }
  function platzEnde() { document.body.classList.remove('platzieren'); $('blatt-platz').classList.remove('offen'); karte.off('move', zeigePlatz); }
  karte.on('click', e => { if (document.body.classList.contains('platzieren')) { karte.panBy(e.containerPoint.subtract(kreuzPt())); } });
  window.addEventListener('resize', () => { if (document.body.classList.contains('platzieren')) setzeKreuz(); });
  $('p-koord').addEventListener('input', e => { const k = parseKoord(e.target.value); if (k) zielAufKreuz(k.lat, k.lon); });
  $('p-ab').addEventListener('click', platzEnde);
  $('p-weiter').addEventListener('click', () => {
    const k = parseKoord($('p-koord').value), c = kreuzLL();
    platz = k ? { lat: k.lat, lon: k.lon, quelle: 'Koordinaten eingegeben' } : { lat: c.lat, lon: c.lng, quelle: 'auf der Karte gesetzt' };
    if (gpsPos) platz.gps = { lat: +f7(gpsPos.lat), lon: +f7(gpsPos.lon), genauigkeit_m: Math.round(gpsPos.acc) };
    platzEnde(); formOeffnen();
  });

  // Formular
  let zustand = 'i.O.';
  const setzeZustand = z => { zustand = z; $('f-zustand').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.z === z))); $('f-schaden').hidden = z === 'i.O.'; };
  $('f-zustand').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setzeZustand(b.dataset.z); });
  function naechsteStrasse(lat, lon) {
    let best = null, bd = 1e9; const kx = 111320 * Math.cos(lat * Math.PI / 180);
    D.strassenNamen.forEach(s => { const d = Math.hypot((s[1] - lon) * kx, (s[2] - lat) * 110540); if (d < bd) { bd = d; best = s[0]; } });
    return bd < 120 ? best : '';
  }
  function formOeffnen() {
    $('f-koord').textContent = `${f7(platz.lat)}, ${f7(platz.lon)} (${platz.quelle})`;
    $('f-strasse').value = naechsteStrasse(platz.lat, platz.lon) || merke('strasse') || '';
    $('f-nr').value = ''; $('f-mastnr').value = ''; $('f-ref').value = ''; $('f-rost').value = ''; $('f-befund').value = ''; $('f-bem').value = '';
    const li = merke('linie'); if (li && linienAlle.includes(li)) $('f-linie').value = li;
    $('f-richtung').value = merke('richtung') || '';
    const von = merke('von'); if (von) $('f-von').value = von;
    setzeZustand('i.O.');
    $('blatt-form').classList.add('offen');
    const h = $('blatt-form').offsetHeight, ms = karte.getSize();
    const pt = karte.latLngToContainerPoint([platz.lat, platz.lon]), ziel = L.point(ms.x / 2, Math.max(70, (ms.y - h) / 2));
    if (h < ms.y - 80) karte.panBy(pt.subtract(ziel), { animate: false });
    if (platzMarker) karte.removeLayer(platzMarker);
    platzMarker = L.circleMarker([platz.lat, platz.lon], { pane: 'masten', interactive: false, radius: 8, color: '#fff', weight: 2.5, fillColor: css('--neu'), fillOpacity: 1 }).addTo(karte);
  }
  let platzMarker = null;
  const formZu = () => { $('blatt-form').classList.remove('offen'); if (platzMarker) { karte.removeLayer(platzMarker); platzMarker = null; } };
  $('f-zurueck').addEventListener('click', () => { const alt = platz; formZu(); platzStart(); if (alt) zielAufKreuz(alt.lat, alt.lon); });
  const zahl = v => { const t = String(v || '').trim().replace(',', '.'); return t === '' || isNaN(+t) ? null : +t; };

  // ---------- Gespeicherte Meldungen
  // Im claude.ai-Artefakt liegen sie in der Artefakt-Datenbank (Sammlung «meldungen»).
  // In der Web-App (und lokal geöffnet) liegen sie auf dem Gerät und gehen über das Teilen-Menü an Claude.
  // Gesendete Meldungen verschwinden von selbst, sobald der Mast in den Kartendaten steht (< 10 m, Kontrolldatum ab Meldetag).
  let speicher = null, meldungen = [], neuPunkte = [];
  const tagIso = s => { const m = String(s || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
  const meldeTag = iso => { const d = new Date(iso); return isNaN(d) ? '9999' : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const meter = (a, b) => Math.hypot((a.lon - b.lon) * 111320 * Math.cos(a.lat * Math.PI / 180), (a.lat - b.lat) * 110540);
  const inKarte = m => typeof m.lat === 'number' && D.masten.some(x => meter(x, m) < 10 && tagIso(x.datum) >= meldeTag(m.gemeldet));

  const LS = 'mk-meldungen';
  const lokal = {
    lies() { try { const l = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } },
    schreib(l) { localStorage.setItem(LS, JSON.stringify(l)); zeigeMeldungen(l); },
    async add(doc) { this.schreib([...this.lies(), { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...doc }]); },
    async del(id) { this.schreib(this.lies().filter(m => m.id !== id)); },
    async setze(ids, felder) { this.schreib(this.lies().map(m => ids.includes(m.id) ? { ...m, ...felder } : m)); },
    start() {
      try { localStorage.setItem(LS + '-probe', '1'); localStorage.removeItem(LS + '-probe'); }
      catch (e) { toast('Dieser Browser kann hier nichts speichern. Erfassen ist deshalb aus.', 6000); return false; }
      const alle = this.lies(), bleiben = alle.filter(m => !(m.status === 'gesendet' && inKarte(m))), n = alle.length - bleiben.length;
      try { if (n) this.schreib(bleiben); else zeigeMeldungen(alle); } catch (e) { zeigeMeldungen(alle); }
      if (n) toast(n === 1 ? '1 gesendete Meldung ist jetzt in der Karte und wurde vom Gerät entfernt.' : `${n} gesendete Meldungen sind jetzt in der Karte und wurden vom Gerät entfernt.`, 5000);
      window.addEventListener('storage', e => { if (e.key === LS) zeigeMeldungen(this.lies()); });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      return true;
    }
  };
  const artefakt = db => ({
    add: doc => db.collection('meldungen').add(doc),
    del: id => db.collection('meldungen').doc(id).delete(),
    start() {
      const warte = setTimeout(() => toast('Gespeicherte Meldungen laden noch …'), 10000);
      db.collection('meldungen').onSnapshot(snap => { clearTimeout(warte); zeigeMeldungen(snap.docs.map(d => ({ ...(d.data() || {}), id: d.id }))); },
        err => { clearTimeout(warte); if (err && err.code === 'revoked') { $('btn-melden').hidden = true; } });
      return true;
    }
  });

  function zeigeMeldungen(liste) {
    neuPunkte.forEach(p => karte.removeLayer(p)); neuPunkte = [];
    meldungen = liste.filter(m => m && m.status !== 'übernommen');
    $('z-neu').textContent = meldungen.length; $('z-neu-box').hidden = meldungen.length === 0;
    meldungen.forEach(m => {
      if (typeof m.lat !== 'number' || typeof m.lon !== 'number') return;
      const gesendet = m.status === 'gesendet';
      const p = L.circleMarker([m.lat, m.lon], { renderer: R.masten, pane: 'masten', radius: 7.5, color: gesendet ? css('--neu') : css('--panel'),
        weight: gesendet ? 3 : 2, fillColor: gesendet ? css('--panel') : css('--neu'), fillOpacity: 1 });
      const adr = [m.strasse, m.nr].filter(Boolean).join(' ') || 'Ohne Adresse';
      const z = [['Linie', esc([m.linie, m.richtung].filter(Boolean).join(', ') || '–')], m.mastnr ? ['Mast-Nr.', esc(m.mastnr)] : null,
        ['Zustand', `<span class="pill ${m.zustand === 'auffällig' ? 'bad' : m.zustand === 'nicht messbar' ? 'nm' : 'ok'}">${esc(m.zustand)}</span>`],
        m.ref_mm != null ? ['Messung', esc(`${m.ref_mm} / ${m.rost_mm ?? '–'} mm`)] : null, m.befund ? ['Befund', esc(m.befund)] : null,
        m.bemerkung ? ['Bemerkung', esc(m.bemerkung)] : null, ['Gemeldet', esc(m.gemeldet_lokal || '')],
        gesendet && m.gesendet ? ['Gesendet', esc(new Date(m.gesendet).toLocaleString('de-CH', { dateStyle: 'short', timeStyle: 'short' }))] : null,
        ['Koordinaten', esc(`${m.lat}, ${m.lon}`)]].filter(Boolean);
      const status = gesendet ? 'An Claude gesendet, noch nicht im Excel' : 'Neu gemeldet, noch nicht an Claude gesendet';
      p.bindPopup(`<div class="pop"><div class="pop-kopf"><span class="schild neu">neu</span><div><h3>${esc(adr)}</h3><div class="sub">${status}</div></div></div>
        <dl>${z.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>${gLinks(m.lat, m.lon)}<button type="button" class="weg" data-weg="${esc(m.id)}">Meldung löschen</button></div>`, { maxWidth: 290 });
      neuPunkte.push(p.addTo(karte));
    });
    zeigeSenden();
  }

  // An Claude senden (nur Web-App): Teilen-Menü des Handys, sonst Zwischenablage
  function zeigeSenden() {
    const b = $('btn-senden');
    if (speicher !== lokal || !meldungen.length) { b.hidden = true; return; }
    const neu = meldungen.filter(m => m.status !== 'gesendet').length;
    b.hidden = false; b.classList.toggle('erneut', !neu);
    const pfeil = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 13v6h14v-6"/></svg>';
    b.innerHTML = neu ? `${pfeil}<span>An Claude senden</span><b class="zaehler">${neu}</b>` : `${pfeil}<span>Erneut senden</span><b class="zaehler">${meldungen.length}</b>`;
  }
  function meldungsText(liste) {
    const zeilen = liste.map((m, i) => {
      const kopf = [`(${m.lat}, ${m.lon})`, [m.strasse, m.nr].filter(Boolean).join(' '), m.mastnr ? `Mast-Nr. ${m.mastnr}` : 'ohne Mast-Nr.',
        m.linie, m.richtung, m.zustand].filter(Boolean).join(', ');
      const verlust = m.ref_mm > 0 && m.rost_mm != null ? `, Verlust ${Math.round((m.ref_mm - m.rost_mm) / m.ref_mm * 100)} %` : '';
      const details = [
        m.befund && `Befund: ${m.befund}`,
        (m.ref_mm != null || m.rost_mm != null) && `Messung: Referenz ${m.ref_mm ?? '–'} mm / Rost ${m.rost_mm ?? '–'} mm${verlust}`,
        m.bemerkung && `Bemerkung: ${m.bemerkung}`,
        `${m.kontrolliert_von || ''}, ${m.gemeldet_lokal || ''}`,
        `Lage ${m.lage || '–'}${m.gps ? `; Handy-GPS ${m.gps.lat}, ${m.gps.lon} (±${m.gps.genauigkeit_m} m)` : ''}`,
        `ID ${m.id}`
      ].filter(Boolean);
      return `${i + 1}. ${kopf}\n   ${details.join('\n   ')}`;
    });
    return `Mastmeldungen aus der Netzkarte (${liste.length}), bitte ins Excel übernehmen:\n\n${zeilen.join('\n\n')}`;
  }
  async function senden() {
    if (speicher !== lokal) return;
    const offen = meldungen.filter(m => m.status !== 'gesendet'), liste = offen.length ? offen : meldungen;
    if (!liste.length) return;
    const text = meldungsText(liste);
    let weg = '';
    if (navigator.share) {
      try { await navigator.share({ text }); weg = 'geteilt'; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    if (!weg) {
      try { await navigator.clipboard.writeText(text); weg = 'kopiert'; }
      catch (e) { toast('Teilen und Kopieren gehen hier nicht. Bitte die Karte in Safari oder Chrome öffnen.', 6000); return; }
    }
    try { await speicher.setze(liste.map(m => m.id), { status: 'gesendet', gesendet: new Date().toISOString() }); } catch (e) { /* Text ist trotzdem weg */ }
    toast(weg === 'kopiert' ? 'Text kopiert. Im Chat mit Claude einfügen und senden.' : 'Übergeben. Die Punkte bleiben violett umrandet, bis die Masten in der Karte stehen.', 6000);
  }
  $('btn-senden').addEventListener('click', senden);

  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-weg]'); if (!b || !speicher) return;
    if (speicher === lokal && !confirm('Diese Meldung vom Gerät löschen?')) return;
    b.disabled = true;
    try { await speicher.del(b.dataset.weg); karte.closePopup(); infoZu(); toast('Meldung gelöscht.'); }
    catch (err) { b.disabled = false; toast(speicher === lokal ? 'Löschen ging nicht.' : 'Löschen ging nicht. Nur Personen mit Bearbeitungsrecht können Meldungen ändern.', 5000); }
  });
  $('f-speichern').addEventListener('click', async () => {
    if (!speicher || !platz) return;
    const strasse = $('f-strasse').value.trim();
    if (!strasse && !$('f-bem').value.trim()) { toast('Bitte Strasse oder Bemerkung angeben.'); return; }
    const jetzt = new Date();
    const doc = {
      status: 'neu', lat: +f7(platz.lat), lon: +f7(platz.lon), lage: platz.quelle, gps: platz.gps || null,
      strasse, nr: $('f-nr').value.trim(), mastnr: $('f-mastnr').value.trim(), linie: $('f-linie').value,
      richtung: $('f-richtung').value.trim(), zustand,
      ref_mm: zustand === 'i.O.' ? null : zahl($('f-ref').value), rost_mm: zustand === 'i.O.' ? null : zahl($('f-rost').value),
      befund: zustand === 'i.O.' ? '' : $('f-befund').value.trim(), bemerkung: $('f-bem').value.trim(), kontrolliert_von: $('f-von').value,
      gemeldet: jetzt.toISOString(), gemeldet_lokal: jetzt.toLocaleString('de-CH', { dateStyle: 'short', timeStyle: 'short' })
    };
    const btn = $('f-speichern'); btn.disabled = true; btn.textContent = 'Speichert …';
    try {
      await speicher.add(doc);
      merke('linie', doc.linie); merke('richtung', doc.richtung); merke('von', doc.kontrolliert_von); merke('strasse', doc.strasse);
      formZu();
      toast(speicher === lokal ? 'Auf dem Gerät gespeichert. Mit «An Claude senden» gibst du die Meldungen weiter.' : 'Gespeichert. Sag Claude «Meldungen übernehmen», dann kommt der Mast ins Excel.', 5000);
    } catch (err) {
      const voll = err && (err.code === 'quota_exceeded' || err.name === 'QuotaExceededError');
      toast(voll ? (speicher === lokal ? 'Speicher voll – bitte Meldungen senden und gesendete löschen.' : 'Speicher voll – bitte Claude Bescheid geben.') : 'Speichern ging nicht. Bitte erneut versuchen oder im Chat melden.', 6000);
    } finally { btn.disabled = false; btn.textContent = 'Speichern'; }
  });
  $('btn-melden').addEventListener('click', platzStart);

  // Speicher wählen: im claude.ai-Artefakt die Datenbank (nur mit Zugriff), sonst das Gerät
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const db = await window.claude.use('db');
        if (!db) return;
        speicher = artefakt(db);
      } else speicher = lokal;
      if (speicher.start()) $('btn-melden').hidden = false; else speicher = null;
    } catch (e) { speicher = null; /* ohne Speicher bleibt die Karte reine Ansicht */ }
  })();
})();
</script>
